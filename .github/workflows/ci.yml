name: Build and test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - run: swift test
      - run: bash scripts/test-local.sh
      - run: bash scripts/package.sh
      - uses: actions/upload-artifact@v6
        with:
          name: Promecapt-${{ runner.arch }}
          path: |
            dist/Promecapt-*.zip
            dist/Promecapt-*.sha256
