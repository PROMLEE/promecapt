name: Build and test
on:
  pull_request:
    paths:
      - 'Sources/**'
      - 'Tests/**'
      - 'Package.swift'
      - 'Package.resolved'
      - 'scripts/test-local.sh'
      - 'scripts/*Checks.swift'
      - 'scripts/check-localization.py'
      - '.github/workflows/ci.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: macos-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - run: swift test
      - run: bash scripts/test-local.sh
