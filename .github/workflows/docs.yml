name: Documentation
on:
  push:
    branches: [main]
    paths: &docs_paths
      - '**/*.md'
      - 'docs/**'
      - 'assets/**'
      - 'llm*.txt'
      - 'scripts/check-docs.py'
      - 'scripts/generate-llms.py'
      - '.github/workflows/docs.yml'
  pull_request:
    paths: *docs_paths
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: python3 scripts/check-docs.py
