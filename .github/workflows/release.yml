name: Release
on:
  push:
    tags: ['v*']
    branches: [main]
    paths: ['.release-version', '.release-attempt']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (without v)'
        required: true
        default: '1.1.8'
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      exists: ${{ steps.release.outputs.exists }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - id: release
        name: Skip an existing release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          REQUESTED_VERSION: ${{ inputs.version }}
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_REF: ${{ github.ref }}
        run: |
          if [[ "$RELEASE_EVENT" == push && "$RELEASE_REF" == refs/heads/main ]]; then
            version="$(cat .release-version)"
          else
            version="${REQUESTED_VERSION:-${RELEASE_TAG#v}}"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "Release v$version already exists; leaving it unchanged."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
  build:
    needs: prepare
    if: needs.prepare.outputs.exists != 'true'

    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - run: swift test
      - run: bash scripts/test-local.sh
      - name: Package
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          MACOS_SIGNING_P12: ${{ secrets.MACOS_SIGNING_P12 }}
          MACOS_SIGNING_PASSWORD: ${{ secrets.MACOS_SIGNING_PASSWORD }}
        run: python3 scripts/with-release-signing.py
      - name: Build drag-to-install DMG
        run: bash scripts/package-dmg.sh
      - name: Sign update archive and feed
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: bash scripts/sign-release.sh
      - uses: actions/upload-artifact@v6
        with:
          name: release-${{ runner.arch }}
          path: |
            dist/Promecapt-*.zip
            dist/Promecapt-*.dmg
            dist/Promecapt-*.sha256
            dist/appcast-*.xml
  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v6
        with:
          pattern: release-*
          merge-multiple: true
          path: release
      - name: Publish requested release or create draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          PUBLISH_RELEASE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          version="$RELEASE_VERSION"
          notes="docs/releases/$version.md"
          if test -f "$notes"; then
            gh release create "v$version" release/* --draft --target "$GITHUB_SHA" --title "Promecapt $version" --notes-file "$notes"
          else
            gh release create "v$version" release/* --draft --target "$GITHUB_SHA" --title "Promecapt $version" --generate-notes
          fi
          if [[ "$PUBLISH_RELEASE" == true ]]; then
            gh release edit "v$version" --draft=false --latest
          fi
