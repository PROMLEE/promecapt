name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (without v)'
        required: true
        default: '1.0.0'
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - run: swift test
      - run: bash scripts/test-local.sh
      - name: Package
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          VERSION="${REQUESTED_VERSION:-${RELEASE_TAG#v}}" bash scripts/package.sh
      - uses: actions/upload-artifact@v6
        with:
          name: release-${{ runner.arch }}
          path: |
            dist/Promecapt-*.zip
            dist/Promecapt-*.sha256
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v6
        with:
          pattern: release-*
          merge-multiple: true
          path: release
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          version="${REQUESTED_VERSION:-${RELEASE_TAG#v}}"
          notes="docs/releases/$version.md"
          if test -f "$notes"; then
            gh release create "v$version" release/* --draft --target "$GITHUB_SHA" --title "Promecapt $version" --notes-file "$notes"
          else
            gh release create "v$version" release/* --draft --target "$GITHUB_SHA" --title "Promecapt $version" --generate-notes
          fi
