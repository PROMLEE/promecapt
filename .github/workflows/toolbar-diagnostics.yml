name: Toolbar diagnostics
on:
  push:
    branches: [main]
    paths: ['.github/workflows/toolbar-diagnostics.yml']
permissions:
  contents: read
  actions: read
jobs:
  summarize:
    runs-on: ubuntu-latest
    steps:
      - name: Read failed toolbar diagnostics
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api /repos/PROMLEE/promecapt/actions/jobs/125113230180/logs > toolbar.log
          python3 - <<'PYCODE'
          from pathlib import Path
          for line in Path('toolbar.log').read_text().splitlines():
              if any(marker in line for marker in ['LAYOUT FAIL:', 'Fatal error:', 'error:']):
                  print(line)
          PYCODE
