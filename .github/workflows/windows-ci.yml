name: Windows build
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - name: Publish portable Windows build
        run: dotnet publish windows/Promecapt/Promecapt.csproj -c Release -r win-x64 --self-contained true -o dist/windows-x64
      - uses: actions/upload-artifact@v6
        with:
          name: Promecapt-Windows-x64
          path: dist/windows-x64
          retention-days: 1
          if-no-files-found: error
